server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend container (named "api" in docker-compose.yml).
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_set_header Host $host;
  }

  # Client-side routing: let React Router handle unknown paths.
  location / {
    try_files $uri /index.html;
  }
}
